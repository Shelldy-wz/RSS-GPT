name: cron_job

# Controls when the workflow will run
on:
  # 每天 UTC 01:00（北京时间 09:00）自动跑一次
  schedule:
    - cron: "0 1 * * *"
  # 也可以在 Actions 页面手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.WORK_TOKEN }}

      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ls_show
        run: |
          python main.py
          python build_page.py || echo "!! build_page failed, feeds still updated"
          ls -al docs/
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          CUSTOM_MODEL: ${{ secrets.CUSTOM_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          U_NAME: ${{ secrets.U_NAME }}

      - name: PUSH
        run: |
          pwd
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git status -s
          git add docs/*
          git add README*
          export TZ='Europe/London'
          git diff --staged --quiet || git commit -m "Auto Build at `date +"%Y-%m-%d %H:%M"`"

          echo "======git push===="
          git push
